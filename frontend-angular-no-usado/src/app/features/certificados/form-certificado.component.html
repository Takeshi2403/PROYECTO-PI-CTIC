<h2>Solicitar certificado</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div class="form-row">
    <label>Estudiante</label>
    <select formControlName="estudianteId">
      <option [ngValue]="null" disabled>Seleccione un estudiante</option>
      <option *ngFor="let e of estudiantes" [ngValue]="e.id">
        {{ e.nombres }} {{ e.apellidos }} ({{ e.codigoEstudiantil }})
      </option>
    </select>
  </div>

  <div class="form-row">
    <label>Tipo de certificado</label>
    <select formControlName="tipo">
      <option value="" disabled>Seleccione un tipo</option>
      <option *ngFor="let t of tipos" [value]="t">{{ t }}</option>
    </select>
  </div>

  <div class="form-row">
    <label>Observaciones</label>
    <textarea formControlName="observaciones" rows="3"></textarea>
  </div>

  <button type="submit" [disabled]="form.invalid || guardando">Solicitar</button>
</form>
