<h2>Certificados</h2>
<a routerLink="/certificados/nuevo"><button>+ Solicitar certificado</button></a>

<div *ngIf="cargando">Cargando...</div>

<table *ngIf="!cargando">
  <thead>
    <tr>
      <th>Codigo</th>
      <th>Estudiante</th>
      <th>Tipo</th>
      <th>Estado</th>
      <th>Fecha solicitud</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of certificados">
      <td>{{ c.codigoVerificacion }}</td>
      <td>{{ c.nombreEstudiante }}</td>
      <td>{{ c.tipo }}</td>
      <td>{{ c.estado }}</td>
      <td>{{ c.fechaSolicitud }}</td>
      <td>
        <button (click)="emitir(c.id)" *ngIf="c.estado === 'PENDIENTE'">Emitir</button>
        <button (click)="anular(c.id)" *ngIf="c.estado !== 'ANULADO'">Anular</button>
      </td>
    </tr>
  </tbody>
</table>
