<h2>Nuevo estudiante</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div class="form-row">
    <label>Codigo estudiantil</label>
    <input formControlName="codigoEstudiantil" />
  </div>
  <div class="form-row">
    <label>Nombres</label>
    <input formControlName="nombres" />
  </div>
  <div class="form-row">
    <label>Apellidos</label>
    <input formControlName="apellidos" />
  </div>
  <div class="form-row">
    <label>Email</label>
    <input formControlName="email" type="email" />
  </div>
  <div class="form-row">
    <label>Programa academico</label>
    <input formControlName="programaAcademico" />
  </div>

  <button type="submit" [disabled]="form.invalid || guardando">Guardar</button>
</form>
